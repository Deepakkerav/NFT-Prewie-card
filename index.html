<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
    <div class="container">
      <main>
         <div class="wrapper">
           <div class="card-img">
             <img src="images/icon-view.svg" alt="">
           </div>
           <div class="equilibrium">
            <p>Equilibrium #3429</p>
          </div>
          <div class="equilibrium-dsc">
            <p>Our Equilibrium collection promotes balance an calm.</p>
          </div>
          <div class="ETH">
            <p class="ETH-1"> <img  class="ETH-IMG" src="images/icon-ethereum.svg" alt="icon-ethereum">0.041 ETH </p>
            <p class="ETH-2"> <img src="images/icon-clock.svg" alt="icon-clock"> 3 days left</p>
          </div>
           <div class="line"></div>
      
           <div class="footer">
            <div class="footer-img">
                 
            </div>
            <div class="des-name">
              <p>Creation of <span class="name-name">Deepak kerav</span></p>
            </div>
           </div>

         </div>
      </main>
    </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
